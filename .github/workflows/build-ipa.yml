name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # don't auto-init, we'll do it manually

      - name: Init submodules (skip unregistered ones)
        run: |
          git submodule update --init --depth=1 MPVKit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create local.properties
        run: touch local.properties
        
      - name: Build iOS framework
        run: ./gradlew :composeApp:compileKotlinIosArm64

      - name: Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS" \
            -archivePath build/Nuvio.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Nuvio.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-IPA
          path: build/ipa/*.ipa
