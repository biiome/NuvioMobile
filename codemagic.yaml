workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      xcode: latest
      vars:
        XCODE_PROJECT: iosApp/iosApp.xcodeproj
        XCODE_TARGET: iosApp
        XCODE_CONFIG: Release
    triggering:
      events:
        - push
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.konan
        - $CM_BUILD_DIR/.gradle
    scripts:
      - name: Create local.properties
        script: touch local.properties
      - name: Build unsigned app
        script: |
          set -euo pipefail
          xcode-project use-profiles --warn-only || true
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration "$XCODE_CONFIG" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            SYMROOT="$CM_BUILD_DIR/build/products" \
            OBJROOT="$CM_BUILD_DIR/build/intermediates" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="$(find "$CM_BUILD_DIR/build/products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n1)"
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }
          STAGE="$CM_BUILD_DIR/build/ipa"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          NAME="$(basename "$APP" .app)"
          (cd "$STAGE" && zip -qry "${NAME}-unsigned.ipa" Payload)
          ls -lh "$STAGE"/*.ipa
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
